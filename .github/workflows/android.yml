name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testPlayDebugUnitTest testInternalDebugUnitTest

      - name: Build Play and Internal debug APKs
        run: gradle assemblePlayDebug assembleInternalDebug

      - name: Build Play release bundle
        run: gradle bundlePlayRelease

      - name: Verify Play manifest excludes Accessibility
        run: sh scripts/check_play_manifest.sh

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zgm-play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

      - name: Upload Internal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zgm-internal-debug-apk
          path: app/build/outputs/apk/internal/debug/app-internal-debug.apk

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zgm-play-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
