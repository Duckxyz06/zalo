name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android 16 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build Play release AAB
        run: gradle bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zgm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: zgm-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
